name: Digger Sandbox

on:
  pull_request:
    paths:
      - '**'
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:

jobs:
  digger-sandbox:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
      statuses: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug from shell
        run: |
          echo "shell ACTIONS_RESULTS_URL=${ACTIONS_RESULTS_URL}"
          echo "shell ACTIONS_RUNTIME_TOKEN set: $([ -n "$ACTIONS_RUNTIME_TOKEN" ] && echo yes || echo no)"

      - name: Debug from Node.js
        uses: actions/github-script@v7
        with:
          script: |
            const keys = ['ACTIONS_RESULTS_URL','ACTIONS_RUNTIME_URL','ACTIONS_RUNTIME_TOKEN','ACTIONS_CACHE_URL'];
            for (const k of keys) {
              const v = process.env[k];
              console.log(`node ${k}: ${v ? 'SET (len=' + v.length + ')' : 'NOT SET'}`);
            }
            console.log('--- all ACTIONS_* keys visible to Node ---');
            for (const k of Object.keys(process.env).sort()) {
              if (k.startsWith('ACTIONS_')) console.log(k);
            }

      - name: Try direct upload via actions/upload-artifact@v4
        uses: actions/upload-artifact@v4
        with:
          name: test-artifact
          path: main.tf
          if-no-files-found: error

      - name: Export artifact env vars to GITHUB_ENV
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL);
            core.exportVariable('ACTIONS_RUNTIME_URL', process.env.ACTIONS_RUNTIME_URL);

      - name: Verify shell now sees them
        run: |
          echo "after-export ACTIONS_RESULTS_URL set: $([ -n "$ACTIONS_RESULTS_URL" ] && echo yes || echo no)"
          echo "after-export ACTIONS_RESULTS_URL value: $ACTIONS_RESULTS_URL"
          echo "after-export ACTIONS_RUNTIME_TOKEN set: $([ -n "$ACTIONS_RUNTIME_TOKEN" ] && echo yes || echo no)"
          echo "after-export ACTIONS_RUNTIME_TOKEN length: ${#ACTIONS_RUNTIME_TOKEN}"

      - name: Run Digger (test artifact v4 upload)
        uses: kiwamizamurai/digger@fix/github-artifacts-v4-upload
        with:
          setup-terraform: true
          terraform-version: 1.5.5
          no-backend: true
          disable-locking: true
          digger-filename: digger.yml
          upload-plan-destination: github
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


